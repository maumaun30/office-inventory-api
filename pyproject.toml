[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the intended idiom
    "UP042",  # keep (str, Enum): StrEnum changes str() output for no gain here
    "UP047",  # keep TypeVar generics for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
