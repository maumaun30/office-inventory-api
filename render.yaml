# Render Blueprint for both services and a shared Postgres.
# Deploy: Render dashboard > New > Blueprint > pick this repo. See README "Deploy to Render".
# All three must share a region: the services reach the database over Render's private network.
# Regions: oregon (Render's default), ohio, virginia, frankfurt, singapore.
databases:
  - name: office-db
    plan: free
    region: singapore
    databaseName: office
    user: office

services:
  - type: web
    name: office-users-api
    runtime: docker
    repo: https://github.com/maumaun30/office-users-api
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: office-db
          property: connectionString
      # Shared secret: registered as the inventory service's Sanctum token on boot.
      - key: INVENTORY_SERVICE_TOKEN
        generateValue: true
      # First admin, created on boot if missing. Set in the dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Web UI origin(s), comma-separated, e.g. https://office-inventory-ui.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: office-inventory-api
    runtime: docker
    repo: https://github.com/maumaun30/office-inventory-api
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: office-db
          property: connectionString
      # Public URL of office-users-api, e.g. https://office-users-api.onrender.com
      - key: USERS_API_URL
        sync: false
      - key: USERS_API_TOKEN
        fromService:
          type: web
          name: office-users-api
          envVarKey: INVENTORY_SERVICE_TOKEN
      # Web UI origin(s), comma-separated, e.g. https://office-inventory-ui.vercel.app
      - key: CORS_ORIGINS
        sync: false
